[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "0.1.0"
description = "Versioned batch pipeline for Telco customer churn scoring."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
